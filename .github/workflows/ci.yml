name: CI

on:
  push:
    branches: [main, feature/uk-job-search-and-application-log]
  pull_request:
  workflow_dispatch:  # also allow manual trigger

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint eligibility engine and focused tests
        run: ruff check src/applypilot/discovery/eligibility.py tests/test_discovery_eligibility.py tests/test_search_preferences.py tests/test_scorer_prefilter.py tests/test_hackernews.py

      - name: Test
        run: pytest tests/ -v
