name: CI

on:
  push:
    branches: [main, feature/uk-job-search-and-application-log]
  pull_request:
  workflow_dispatch:  # also allow manual trigger

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint database and discovery quota paths
        run: >-
          ruff check
          src/applypilot/database.py
          src/applypilot/discovery/eligibility.py
          src/applypilot/discovery/jobspy.py
          src/applypilot/discovery/workday.py
          src/applypilot/discovery/ats_common.py
          src/applypilot/discovery/amazon.py
          src/applypilot/discovery/costco.py
          src/applypilot/discovery/builtin.py
          src/applypilot/discovery/smartextract.py
          src/applypilot/discovery/hackernews.py
          src/applypilot/integrations/google_sheets.py
          tests/test_google_sheets.py
          tests/test_discovery_daily_cap.py

      - name: Full regression suite (all discovery and application tests)
        run: pytest tests/ -v
