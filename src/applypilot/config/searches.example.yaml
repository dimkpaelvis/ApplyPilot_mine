# ApplyPilot search configuration
# Copy to ~/.applypilot/searches.yaml and customize for your job search.
# The wizard (applypilot init) generates a basic version automatically.

# Search queries -- each has a query string and priority tier.
# Tier 1: High-priority exact matches (searched first, highest precision)
# Tier 2: Strong matches, broader scope
# Tier 3: Wide net, high volume, lower precision
locations:
  - location: "Remote"
    remote: true

allowed_remote_countries:
  - "United Kingdom"
  - "Ireland"
  - "United States"
  - "Canada"
  - "Australia"
  - "New Zealand"
  - "South Africa"
  - "Singapore"

queries:
  - query: "junior data analyst"
    tier: 1
  - query: "part-time data analyst"
    tier: 1
  - query: "freelance data analyst"
    tier: 1
  - query: "contract data analyst"
    tier: 1
  - query: "junior SQL analyst"
    tier: 2
  - query: "data quality analyst"
    tier: 2
  - query: "junior data engineer"
    tier: 2
  - query: "freelance SQL developer"
    tier: 2
  - query: "part-time reporting analyst"
    tier: 2

# Location filtering -- accept/reject patterns for job location text
location_accept:
  - "United Kingdom"
  - "UK"
  - "Remote"
location_reject_non_remote:
  - "onsite only"
  - "on-site only"

# JobSpy source names consumed by the current discovery runner.
# Indeed remains country-scoped by country_indeed below; LinkedIn is searched
# with the broad Remote location and then checked against the country allowlist.
sites:
  - indeed
  - linkedin

# Search defaults
defaults:
  results_per_site: 30
  hours_old: 72
  country_indeed: "uk"
  remote_only: true
  employment_types:
    - parttime
    - contract  # includes freelance engagements

# Negative keywords -- skip jobs with these in the title (case-insensitive)
exclude_titles:
  - "senior director"
  - "VP "
  - "vice president"
  - "chief"
  - "intern"
  - "internship"
  - "co-op"
  - "clearance required"
  - "TS/SCI"
  - "principal scientist"
